name: Compilar para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# El proyecto está en la subcarpeta AGAsesorCuotas/ del repositorio.
defaults:
  run:
    working-directory: AGAsesorCuotas

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            AGAsesorCuotas/requirements.txt
            AGAsesorCuotas/requirements-dev.txt
            AGAsesorCuotas/requirements-build.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Comprobar que pywin32 se importa
        run: python -c "import win32com.client, pythoncom, outlook_sender; print('pywin32 OK')"

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm --clean AGAsesorCuotas.spec

      - name: Prueba de arranque del ejecutable (modo simulado)
        shell: pwsh
        run: |
          $env:AGASESOR_DATA_DIR = "$env:RUNNER_TEMP\agasesor-smoke"
          $p = Start-Process -FilePath dist\AGAsesorCuotas\AGAsesorCuotas.exe `
               -ArgumentList "--simulado","--no-navegador","--puerto","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/
              if ($r.StatusCode -eq 200 -and $r.Content -match "Envío de correos") { $ok = $true; break }
            } catch {}
          }
          $css = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/static/styles.css
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or $css.StatusCode -ne 200) { throw "El ejecutable no sirvió la interfaz" }
          Write-Host "Interfaz y recursos servidos correctamente"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AGAsesorCuotas-windows-x64
          path: AGAsesorCuotas/dist/AGAsesorCuotas/
          retention-days: 30
